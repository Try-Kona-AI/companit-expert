# Deploy-time settings for the Kona AI project. project_id is a local label only;
# the real target is always passed with --project-ref.
project_id = "companit-expert"

[functions.send-email]
verify_jwt = true

# RU <-> EN translator, called by the signed-in owner from the app.
[functions.translate]
verify_jwt = true

# Apollo prospecting (property managers -> leads). Signed-in owner only.
[functions.apollo-search]
verify_jwt = true

# Called from the public payment page, which has no session.
[functions.stripe-checkout]
verify_jwt = false

# Called by Stripe.
[functions.stripe-webhook]
verify_jwt = false

# Sends owner-approved outreach batches. Signed-in workspace member only.
[functions.send-campaign]
verify_jwt = true

# Public unsubscribe link inside outreach emails; recipients have no session.
[functions.outreach-unsubscribe]
verify_jwt = false

# Daily automatic reminders, called by pg_cron. Guarded by the CRON_SECRET
# function secret (x-cron-secret header), not a user session.
[functions.send-reminders]
verify_jwt = false
