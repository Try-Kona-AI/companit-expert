# Deploys database migrations and edge functions to the Kona Supabase project
# whenever supabase/ changes on main. Vercel deploys the app itself on its own.
# Needs repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF
name: Supabase deploy
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:
concurrency: supabase-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations
        run: supabase db push --project-ref "$REF" -p "${{ secrets.SUPABASE_DB_PASSWORD }}" --include-all
      - name: Deploy edge functions
        run: |
          for d in supabase/functions/*/; do
            fn=$(basename "$d")
            case "$fn" in stripe-checkout|stripe-webhook) continue ;; esac
            supabase functions deploy "$fn" --project-ref "$REF" --use-api
          done
